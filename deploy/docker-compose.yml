services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ember_trove
      POSTGRES_USER: ember_trove
      POSTGRES_PASSWORD: ember_trove_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember_trove"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local S3 (MinIO's community images were withdrawn from Docker Hub/quay in
  # 2026). SeaweedFS: single container, S3 gateway on :9000; the admin identity
  # comes from AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY. Prod uses AWS S3.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=9000
    environment:
      AWS_ACCESS_KEY_ID: ember_trove
      AWS_SECRET_ACCESS_KEY: ember_trove_dev
    ports:
      - "9000:9000"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the S3 bucket on first boot so attachment uploads work immediately.
  # The bucket stays PRIVATE: the API serves downloads via presigned URLs, so
  # anonymous read access is never needed. Idempotent across restarts.
  s3-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        out=$$(echo 's3.bucket.create -name ember-trove' | weed shell -master=s3:9333 2>&1);
        echo \"$$out\";
        echo \"$$out\" | grep -Eq 'created bucket|already exists' &&
        echo 'S3 bucket ready.'
      "
    restart: on-failure

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    # Override sensitive defaults by running with --env-file deploy/.env.local
    # See deploy/.env.local.example for the required variables.
    environment:
      DATABASE_URL: postgres://ember_trove:ember_trove_dev@postgres/ember_trove
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: ember-trove
      S3_ACCESS_KEY: ember_trove
      S3_SECRET_KEY: ember_trove_dev
      S3_REGION: us-east-1
      OIDC_ISSUER: https://cognito-idp.us-east-2.amazonaws.com/us-east-2_4RQfxhKqn
      OIDC_CLIENT_ID: eogq2sehdad3uc8nmar7aneol
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-change-me}
      # Cognito Admin — used by /api/admin/* endpoints.
      COGNITO_USER_POOL_ID: us-east-2_4RQfxhKqn
      COGNITO_REGION: us-east-2
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-change-me}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-change-me}
      # 128-char hex key (64 bytes) for cookie encryption. The API rejects a
      # weak/all-identical key at startup, so this MUST come from deploy/.env.local.
      # Generate one with: openssl rand -hex 64
      COOKIE_KEY: "${COOKIE_KEY:?set COOKIE_KEY in deploy/.env.local (openssl rand -hex 64)}"
      FRONTEND_URL: "http://localhost:8003"
      API_EXTERNAL_URL: "http://localhost:8003"
      # Local dev is plain http — opt out of Secure cookies (prod defaults on).
      COOKIE_SECURE: "false"
      HOST: "0.0.0.0"
      PORT: "3003"
      RUST_LOG: info
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
    ports:
      - "8003:8080"
    depends_on:
      - api

volumes:
  pgdata:
  s3data:
