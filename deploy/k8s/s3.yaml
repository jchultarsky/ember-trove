# Local/self-hosted S3 for the cluster. MinIO's community images were withdrawn
# from Docker Hub/quay in 2026; SeaweedFS (Apache-2.0) serves the S3 API on
# :9000. The admin identity comes from AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY.
# Create the bucket once after first rollout (it stays private — the API serves
# downloads via presigned URLs):
#   kubectl -n ember-trove exec s3-0 -- sh -c \
#     "echo 's3.bucket.create -name <S3_BUCKET>' | weed shell -master=localhost:9333"
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s3
  namespace: ember-trove
spec:
  serviceName: s3
  replicas: 1
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          args: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=9000"]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ember-trove-secrets
                  key: S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ember-trove-secrets
                  key: S3_SECRET_KEY
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9000
            periodSeconds: 10
          volumeMounts:
            - name: s3data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: s3data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: ember-trove
spec:
  clusterIP: None
  selector:
    app: s3
  ports:
    - name: api
      port: 9000
