# cargo-audit configuration — SINGLE SOURCE OF TRUTH for ignored advisories.
#
# CI runs a bare `cargo audit`, which reads this file automatically. Do NOT add
# inline `--ignore` flags to .github/workflows/ci.yml — that previously created
# two divergent lists (consolidated here on 2026-05-29).
#
# Policy: every ignore is transitive-only with no available upgrade path, and
# carries a dated rationale below. Review on every release; drop an ignore the
# moment upstream publishes a fix that bumps our Cargo.lock. Do not let this
# list grow silently.
[advisories]
ignore = [
  # NOTE: the legacy AWS-SDK rustls 0.21 / rustls-webpki 0.101.7 chain — and its
  # four ignores (RUSTSEC-2026-0049/0098/0099/0104) — were ELIMINATED on
  # 2026-05-29 by setting `default-features = false` on the aws-sdk-{s3,
  # cognitoidentityprovider,sesv2} crates and dropping their legacy `rustls`
  # feature. The SDK now uses the modern `default-https-client` (rustls 0.23 +
  # aws-lc-rs). `cargo tree -i rustls-webpki@0.101.7` returns nothing; verified
  # with a live TLS round-trip to S3 (InvalidAccessKeyId over TLS).

  # NOTE (2026-10-22 review): RUSTSEC-2026-0002 (`lru` unsound) and
  # RUSTSEC-2026-0097 (`rand` unsound) were DROPPED. Neither matched Cargo.lock
  # any more (`cargo audit` run with this file removed). The later `lru`
  # advisory RUSTSEC-2026-0253 was fixed by upgrading, not ignored:
  # aws-sdk-s3 1.138 → 1.152 moved `lru` 0.16.4 → 0.18.5.

  # ── Unmaintained, no alternative ────────────────────────────────────────────
  #   2026-10-22 (re-reviewed; first added 2026-05-29): RUSTSEC-2024-0436 —
  #     `paste` 1.0.15 marked unmaintained. Compile-time proc-macro reached only
  #     through the UI's Leptos 0.8.22 graph (e.g. `either_of`); nothing in api/
  #     or common/ uses it. Leptos owns the upgrade path. Warning-level only,
  #     not a vulnerability.
  "RUSTSEC-2024-0436",

  # ── No fix available, never compiled ───────────────────────────────────────
  #   2026-10-22 (re-reviewed; first added 2026-05-29): RUSTSEC-2023-0071 —
  #     Marvin timing side channel in `rsa` 0.9.10. Its only path is
  #     sqlx / sqlx-macros-core → sqlx-mysql (optional, MySQL feature), which
  #     is NOT compiled into anything we build: `cargo tree --workspace
  #     -i sqlx-mysql --target all -e all` prints nothing. It appears only
  #     because Cargo.lock records optional deps regardless of enabled features
  #     (an earlier note here wrongly said the proc-macro always compiles it).
  #     No fixed `rsa` exists (patched = [], only 0.10 pre-releases).
  "RUSTSEC-2023-0071",

  # ── Fix needs a major sqlx bump, never compiled ────────────────────────────
  #   2026-11-09 (owner decision; first added): RUSTSEC-2026-0459 —
  #     CVE-2026-119375 in the C SQLite that `libsqlite3-sys` 0.30.1 bundles
  #     (medium, 6.8). Its only path is sqlx → sqlx-sqlite 0.8.6 (optional,
  #     SQLite feature), which is NOT compiled into anything we build:
  #     `cargo tree --workspace -i libsqlite3-sys --target all -e all` and the
  #     same for `sqlx-sqlite` both print nothing. We enable sqlx's `postgres`
  #     feature only, and CI installs sqlx-cli with `--no-default-features
  #     --features postgres`. Like `rsa` above, it is listed only because
  #     Cargo.lock records optional deps.
  #     The fix is libsqlite3-sys >= 0.39.0. sqlx-sqlite 0.8.6 pins 0.30.1, so
  #     the upgrade path is sqlx 0.9, a major bump (and the sqlx-cli pin in
  #     ci.yml moves with it). DROP THIS ENTRY with that bump. If the SQLite
  #     feature is ever enabled, drop it first: the advisory then applies.
  "RUSTSEC-2026-0459",
]
